name: Build and Deploy

on:
  push:
    branches: [master]
  workflow_run:
    workflows: ["Daily Upgrade"]
    types:
      - completed

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ghcr.io/varsys-org/varsys-react-ui:latest
      # NOTE: No Coolify app for varsys-ui yet. Add one in Coolify UI first,
      # then uncomment and set the UUID:
      # - name: Deploy (Coolify)
      #   run: |
      #     curl --fail --request GET 'https://coolify.varsys.co.in/api/v1/deploy?uuid=<UUID>&force=false' \
      #       --header "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"
